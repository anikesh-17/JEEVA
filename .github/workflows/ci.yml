name: JEEVA CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/jeeva-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/jeeva-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend/jeeva-frontend
          npm run build

  ml-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          cd ml-service/jeeva-ml
          pip install -r requirements.txt

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test, ml-lint-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Test Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service/jeeva-ml
          file: ./ml-service/jeeva-ml/Dockerfile
          push: false

      - name: Test Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/jeeva-frontend
          file: ./frontend/jeeva-frontend/Dockerfile
          push: false
